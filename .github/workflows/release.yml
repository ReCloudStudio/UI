name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  pull-requests: write
  id-token: write
  packages: write

jobs:
  version:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: bun run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        registry:
          - name: npm
            url: https://registry.npmjs.org
          - name: github
            url: https://npm.pkg.github.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: ${{ matrix.registry.url }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/ui typecheck && bun run --cwd packages/ui build
      - run: test "v$(node -p \"require('./packages/ui/package.json').version\")" = "$GITHUB_REF_NAME"
      - if: matrix.registry.name == 'npm'
        run: npm publish --provenance --access public --registry=${{ matrix.registry.url }}
        working-directory: packages/ui
      - if: matrix.registry.name == 'github'
        run: npm publish --registry=${{ matrix.registry.url }}
        working-directory: packages/ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
